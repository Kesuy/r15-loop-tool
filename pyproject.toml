[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "r15-loop-tool"
version = "1.0.2"
description = "Cinebench R15 循环跑分与响应式 HTML 报告工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pyinstaller>=6.10,<7",
  "setuptools>=75,<81",
]

[project.scripts]
r15-loop-tool = "r15tool.cli:main"

[tool.setuptools.packages.find]
include = ["r15tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
